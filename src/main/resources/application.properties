spring.application.name=cardissuing
server.port=${SERVER_PORT:8081}

# Logging Configuration
logging.level.bank.cardissuing=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n

# Database Configuration (PostgreSQL + Hikari)
spring.datasource.type=${DB_TYPE:com.zaxxer.hikari.HikariDataSource}
spring.datasource.url=${DB_URL:jdbc:postgresql://200.73.194.40:5432/RegistersNaturalPD}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:4l0d1g4.1208}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# --- Core banking (authorizer funds source for debit-with-core cards) ---
# simulated: in-memory stand-in (default). fineract: real Mifos over REST.
core.mode=${CORE_MODE:simulated}
core.simulated.default-balance=${CORE_SIM_BALANCE:10000}
core.fineract.base-url=${FINERACT_URL:https://corebancario.alocashfintech.com:4433/fineract-provider/api/v1}
core.fineract.tenant=${FINERACT_TENANT:default}
core.fineract.username=${FINERACT_USER:}
core.fineract.password=${FINERACT_PASSWORD:}
core.fineract.payment-type-id=${FINERACT_PAYMENT_TYPE:1}

# --- Authorization holds ---
holds.default-days=${HOLDS_DEFAULT_DAYS:7}
holds.expiry.enabled=${HOLDS_EXPIRY_ENABLED:true}
holds.expiry.interval-ms=${HOLDS_EXPIRY_INTERVAL_MS:60000}
holds.expiry.initial-delay-ms=${HOLDS_EXPIRY_INITIAL_DELAY_MS:30000}
core.fineract.savings-product-id=${FINERACT_SAVINGS_PRODUCT:1}
core.fineract.office-id=${FINERACT_OFFICE:1}

# --- Reconciliation with the core ---
reconciliation.enabled=${RECONCILIATION_ENABLED:true}
reconciliation.interval-ms=${RECONCILIATION_INTERVAL_MS:900000}
reconciliation.initial-delay-ms=${RECONCILIATION_INITIAL_DELAY_MS:60000}

# --- Disputes (aclaraciones) ---
disputes.deadline-check.enabled=${DISPUTES_DEADLINE_CHECK_ENABLED:true}
disputes.deadline-check.interval-ms=${DISPUTES_DEADLINE_CHECK_INTERVAL_MS:3600000}
disputes.deadline-check.initial-delay-ms=${DISPUTES_DEADLINE_CHECK_INITIAL_DELAY_MS:120000}

# --- Online fraud engine ---
fraud.review-threshold=${FRAUD_REVIEW_THRESHOLD:50}
fraud.decline-threshold=${FRAUD_DECLINE_THRESHOLD:80}
fraud.velocity.window-min=${FRAUD_VELOCITY_WINDOW_MIN:10}
fraud.velocity.max=${FRAUD_VELOCITY_MAX:5}
fraud.declines.window-min=${FRAUD_DECLINES_WINDOW_MIN:30}
fraud.declines.max=${FRAUD_DECLINES_MAX:3}
fraud.enumeration.window-min=${FRAUD_ENUMERATION_WINDOW_MIN:10}
fraud.enumeration.min-attempts=${FRAUD_ENUMERATION_MIN_ATTEMPTS:4}
fraud.enumeration.min-cards=${FRAUD_ENUMERATION_MIN_CARDS:3}
fraud.amount.first-transaction-max=${FRAUD_FIRST_TX_MAX:3000}
fraud.new-card.hours=${FRAUD_NEW_CARD_HOURS:24}
fraud.new-card.max=${FRAUD_NEW_CARD_MAX:1000}
fraud.geo-jump.hours=${FRAUD_GEO_JUMP_HOURS:2}
fraud.step-up.ttl-min=${FRAUD_STEP_UP_TTL_MIN:5}
fraud.step-up.expose-otp=${FRAUD_STEP_UP_EXPOSE_OTP:false}

# --- Plasticos / bureau de personalizacion ---
plastics.manufacturer=${PLASTICS_MANUFACTURER:PERSO-BUREAU}
plastics.manufacturer-key-base64=${PLASTICS_MANUFACTURER_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
plastics.expose-plaintext=${PLASTICS_EXPOSE_PLAINTEXT:false}
plastics.service-code=${PLASTICS_SERVICE_CODE:201}
plastics.default-chip-profile=${PLASTICS_CHIP_PROFILE:LACPI-MX-01}
plastics.renewal-validity-years=${PLASTICS_RENEWAL_YEARS:3}
plastics.renewal-window-days=${PLASTICS_RENEWAL_WINDOW_DAYS:60}

# --- Reportes (umbrales y limites) ---
reports.relevant-threshold=${REPORTS_PLD_RELEVANT:10000}
reports.accumulated-threshold=${REPORTS_PLD_ACCUMULATED:25000}
reports.unusual-risk-score=${REPORTS_PLD_UNUSUAL_SCORE:40}
reports.inactive-days=${REPORTS_INACTIVE_DAYS:90}
reports.max-rows=${REPORTS_MAX_ROWS:5000}
reports.default-period-days=${REPORTS_DEFAULT_PERIOD_DAYS:30}
